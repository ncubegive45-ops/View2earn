<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View2Earn - History & Ledger</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <header>
        <div class="logo">View2<span>Earn</span></div>
        <div class="wallet-badge">Balance: $<span id="balance">0.00</span></div>
    </header>

    <main>
        <div class="hero" style="margin-bottom: 1.5rem;">
            <h1>Activity & Transaction History</h1>
            <p>Review your completed video earnings and payout requests.</p>
        </div>

        <div style="max-width: 600px; margin: 0 auto; background-color: var(--card-bg); padding: 1.5rem; border-radius: 12px; border: 1px solid #334155;">
            <h3 style="margin-bottom: 1rem; color: var(--text);">📜 Recent Activity</h3>
            
            <div id="history-list" style="display: flex; flex-direction: column; gap: 0.75rem;">
                <!-- History items will load here dynamically -->
                <div style="padding: 1rem; background-color: #0f172a; border-radius: 8px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <strong style="font-size: 0.9rem; display: block; color: var(--text);">Welcome Bonus</strong>
                        <span style="font-size: 0.75rem; color: var(--text-muted);">Account Created</span>
                    </div>
                    <span style="color: var(--accent); font-weight: bold; font-size: 0.95rem;">+$0.00</span>
                </div>
            </div>
        </div>
    </main>

        <!-- Bottom Navigation Bar with SVG Icons -->
    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-item">
            <svg style="width: 20px; height: 20px; fill: currentColor;" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            Dashboard
        </a>
        <a href="referrals.html" class="bottom-nav-item">
            <svg style="width: 20px; height: 20px; fill: currentColor;" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            Referrals
        </a>
        <a href="payout.html" class="bottom-nav-item">
            <svg style="width: 20px; height: 20px; fill: currentColor;" viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
            Withdraw
        </a>
        <a href="menu.html" class="bottom-nav-item">
            <!-- Menu Hamburger SVG Icon -->
            <svg style="width: 20px; height: 20px; fill: currentColor;" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            Menu
        </a>
    </nav>

    <footer>
        <p>&copy; 2026 View2Earn. All rights reserved.</p>
    </footer>

    <script>
        let balance = parseFloat(localStorage.getItem('userBalance')) || 0.00;
        document.getElementById('balance').innerText = balance.toFixed(2);

        // Load transaction history from localStorage if available
        let history = JSON.parse(localStorage.getItem('userHistory')) || [
            { title: "Account Registration Bonus", type: "earned", amount: "0.00", date: "Today" }
        ];

        let historyContainer = document.getElementById('history-list');
        historyContainer.innerHTML = '';

        history.forEach(item => {
            let isPositive = item.type === 'earned';
            let color = isPositive ? 'var(--accent)' : '#ef4444';
            let sign = isPositive ? '+' : '-';

            historyContainer.innerHTML += `
                <div style="padding: 1rem; background-color: #0f172a; border-radius: 8px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <strong style="font-size: 0.9rem; display: block; color: var(--text);">${item.title}</strong>
                        <span style="font-size: 0.75rem; color: var(--text-muted);">${item.date || 'Recent'}</span>
                    </div>
                    <span style="color: ${color}; font-weight: bold; font-size: 0.95rem;">${sign}$${item.amount}</span>
                </div>
            `;
        });
    </script>
</body>
</html>
