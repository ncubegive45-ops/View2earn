<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body>

    <header>
        <div class="logo">View2<span>Earn</span></div>
        
                <!-- Bottom Navigation Bar -->

        <a href="index.html" class="bottom-nav-item">
            <svg style="width: 20px; height: 20px; fill: currentColor;" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            Dashboard
        </a>
        <a href="referrals.html" class="bottom-nav-item active">
            <svg style="width: 20px; height: 20px; fill: currentColor;" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            Referrals
        </a>
        <a href="payout.html" class="bottom-nav-item">
            <svg style="width: 20px; height: 20px; fill: currentColor;" viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
            Withdraw
        </a>
        <a href="menu.html" class="bottom-nav-item">
            <svg style="width: 20px; height: 20px; fill: currentColor;" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            Menu
        </a>
    </nav>


    </header>

    <main>
        <div class="hero">
            <h1>Invite Friends & Earn More</h1>
            <p>Share your unique referral link and earn 10% of what your friends make!</p>
        </div>

        <div style="max-width: 600px; margin: 0 auto; background-color: var(--card-bg); padding: 2rem; border-radius: 12px; border: 1px solid #334155;">
            
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text-muted);">Your Unique Referral Link</label>
                <div style="display: flex; gap: 0.5rem;">
                    <input type="text" id="ref-link" value="https://view2earn.app/?ref=user1234" readonly style="flex: 1; padding: 0.75rem; border-radius: 6px; background-color: #0f172a; color: white; border: 1px solid #334155;">
                    <button onclick="copyRefLink()" class="watch-btn" style="width: auto; padding: 0.75rem 1.25rem; background-color: var(--primary);">Copy</button>
                </div>
                <p id="copy-msg" style="color: var(--accent); font-size: 0.8rem; margin-top: 0.5rem; height: 1rem;"></p>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; text-align: center; margin-top: 2rem;">
                <div style="background-color: #0f172a; padding: 1.25rem; border-radius: 8px; border: 1px solid #334155;">
                    <span style="color: var(--text-muted); font-size: 0.85rem;">Total Referrals</span>
                    <h3 style="font-size: 1.8rem; margin-top: 0.25rem; color: var(--text);">0</h3>
                </div>
                <div style="background-color: #0f172a; padding: 1.25rem; border-radius: 8px; border: 1px solid #334155;">
                    <span style="color: var(--text-muted); font-size: 0.85rem;">Referral Earnings</span>
                    <h3 style="font-size: 1.8rem; margin-top: 0.25rem; color: var(--accent);">$0.00</h3>
                </div>
            </div>

        </div>
    </main>

    <footer>
        <p>&copy; 2026 View2Earn. All rights reserved.</p>
    </footer>

    <script>
        function copyRefLink() {
            const refInput = document.getElementById('ref-link');
            refInput.select();
            refInput.setSelectionRange(0, 99999); // For mobile devices
            navigator.clipboard.writeText(refInput.value);
            
            const msg = document.getElementById('copy-msg');
            msg.innerText = "Referral link copied to clipboard!";
            setTimeout(() => {
                msg.innerText = "";
            }, 3000);
        }
    </script>
</body>
</html>
