<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View2Earn - Daily Bonus</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <header>
        <div class="logo">View2<span>Earn</span></div>
        <div class="wallet-badge">Balance: $<span id="balance">0.00</span></div>
    </header>


    <main>
        <div class="hero" style="margin-bottom: 1.5rem;">
            <h1>Daily Login Bonus</h1>
            <p>Check in every day to claim free cash rewards without watching videos!</p>
        </div>

        <div style="max-width: 500px; margin: 0 auto; background-color: var(--card-bg); padding: 2rem; border-radius: 12px; border: 1px solid #334155; text-align: center;">
            <div style="font-size: 3rem; margin-bottom: 1rem;">🎁</div>
            <h3 style="margin-bottom: 0.5rem; color: var(--text);">Claim Your Day 1 Reward</h3>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">Get **$0.02** added straight to your balance instantly.</p>
            
            <button id="claim-btn" onclick="claimDailyBonus()" class="watch-btn" style="background-color: var(--accent); color: #000; font-size: 1rem; padding: 0.85rem;">Claim $0.02 Bonus</button>
            <p id="bonus-msg" style="margin-top: 1rem; font-size: 0.85rem; height: 1.5rem;"></p>
        </div>
    </main>

        <!-- Bottom Navigation Bar with SVG Icons -->
    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-item">
            <svg style="width: 20px; height: 20px; fill: currentColor;" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            Dashboard
        </a>
        <a href="referrals.html" class="bottom-nav-item">
            <svg style="width: 20px; height: 20px; fill: currentColor;" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            Referrals
        </a>
        <a href="payout.html" class="bottom-nav-item">
            <svg style="width: 20px; height: 20px; fill: currentColor;" viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
            Withdraw
        </a>
        <a href="menu.html" class="bottom-nav-item">
            <!-- Menu Hamburger SVG Icon -->
            <svg style="width: 20px; height: 20px; fill: currentColor;" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            Menu
        </a>
    </nav>

    <footer>
        <p>&copy; 2026 View2Earn. All rights reserved.</p>
    </footer>

    <script>
        let balance = parseFloat(localStorage.getItem('userBalance')) || 0.00;
        document.getElementById('balance').innerText = balance.toFixed(2);

        // Check if already claimed today
        let lastClaimDate = localStorage.getItem('lastClaimDate');
        let today = new Date().toDateString();
        
        if (lastClaimDate === today) {
            disableClaimButton();
        }

        function claimDailyBonus() {
            if (lastClaimDate === today) return;

            balance += 0.02;
            localStorage.setItem('userBalance', balance);
            localStorage.setItem('lastClaimDate', today);
            
            document.getElementById('balance').innerText = balance.toFixed(2);

            // Add to history log
            let history = JSON.parse(localStorage.getItem('userHistory')) || [];
            history.unshift({ title: "Daily Login Bonus", type: "earned", amount: "0.02", date: "Today" });
            localStorage.setItem('userHistory', JSON.stringify(history));

            disableClaimButton();
            
            const msg = document.getElementById('bonus-msg');
            msg.style.color = "#22c55e";
            msg.innerText = "Success! $0.02 added to your wallet.";
        }

        function disableClaimButton() {
            const btn = document.getElementById('claim-btn');
            btn.disabled = true;
            btn.style.backgroundColor = "#334155";
            btn.style.color = "#94a3b8";
            btn.innerText = "Already Claimed Today!";
        }
    </script>
</body>
</html>
