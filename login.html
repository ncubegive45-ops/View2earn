<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View2Earn - Account / Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">View2<span>Earn</span></div>
        <nav>
            <a href="index.html" style="color: var(--text-muted); text-decoration: none; margin-right: 1.5rem; font-weight: 600;">Dashboard</a>
            <a href="payout.html" style="color: var(--text-muted); text-decoration: none; margin-right: 1.5rem; font-weight: 600;">Withdraw</a>
            <a href="referrals.html" style="color: var(--text-muted); text-decoration: none; margin-right: 1.5rem; font-weight: 600;">Referrals</a>
            <a href="login.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Account</a>
        </nav>
    </header>

    <main>
        <div class="hero">
            <h1>Welcome to View2Earn</h1>
            <p>Log in or create your account to sync your earnings.</p>
        </div>

        <div style="max-width: 400px; margin: 0 auto; background-color: var(--card-bg); padding: 2rem; border-radius: 12px; border: 1px solid #334155;">
            
            <div style="margin-bottom: 1.25rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text-muted);">Email Address</label>
                <input type="email" id="user-email" placeholder="name@example.com" style="width: 100%; padding: 0.75rem; border-radius: 6px; background-color: #0f172a; color: white; border: 1px solid #334155;">
            </div>

            <div style="margin-bottom: 2rem;">
    <label style="display: block; margin-bottom: 0.5rem;">Password</label>
    <input type="password" id="user-pass" placeholder="******">
         </div>
                
            <div id="code-section" style="display: none; margin-top: 1.25rem; margin-bottom: 1.5rem;">
    <label style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text-muted);">Enter 6-Digit Code</label>
    <input type="text" id="verification-code" placeholder="123456" maxlength="6" style="width: 100%; padding: 0.75rem; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; margin-bottom: 1rem;">
    <button onclick="verifyAndLogin()" class="watch-btn" style="width: 100%; background-color: #22c55e; color: white; border: none; padding: 0.75rem; border-radius: 8px; font-weight: bold; cursor: pointer;">Verify & Login</button>
        </div>

<button onclick="proceedToVerification()" class="watch-btn" style="width: 100%; margin-top: 1rem;">Login</button>
<p id="auth-msg" style="text-align: center; font-size: 0.85rem; height: 1.5rem; margin-top: 1rem; color: #ef4444;"></p>

    <footer>
        <p>&copy; 2026 View2Earn. All rights reserved.</p>
    </footer>

    <script>
(function(){
    emailjs.init({
       publicKey: "NSgTCeJEfUHTXw2H8",
    });
})();

let generatedCode = '';

function sendVerificationCode() {
    const email = document.getElementById('user-email').value.trim();
    const msg = document.getElementById('auth-msg');

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(email)) {
        msg.style.color = "#ef4444";
        msg.innerText = "Please enter a valid email address.";
        return;
    }

    generatedCode = Math.floor(100000 + Math.random() * 900000).toString();

    const templateParams = {
        to_email: email,
        verification_code: generatedCode
    };

    msg.style.color = "#3b82f6";
    msg.innerText = "Sending verification code...";

    emailjs.send('service_rxwbmke', '__ejs-test-mail-service__', templateParams)
    .then(function(response) {
        msg.style.color = "#22c55e";
        msg.innerText = "Code sent! Check your inbox.";
        document.getElementById('code-section').style.display = 'block';
    }, function(error) {
        msg.style.color = "#ef4444";
        msg.innerText = "Failed to send email. Try again.";
    });
}

function verifyAndLogin() {
    const email = document.getElementById('user-email').value.trim();
    const userEnteredCode = document.getElementById('verification-code').value.trim();
    const msg = document.getElementById('auth-msg');

    if (userEnteredCode === generatedCode) {
        localStorage.setItem('userEmail', email);
        msg.style.color = "#22c55e";
        msg.innerText = "Email verified successfully! Logging in...";

        setTimeout(() => {
            window.location.href = "index.html";
        }, 1500);
    } else {
        msg.style.color = "#ef4444";
        msg.innerText = "Invalid verification code. Try again.";
    }
}
